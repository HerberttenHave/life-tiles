<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7a4a2a">
<title>Levensboek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <button id="btnBack" class="barbtn" aria-label="Terug">&#8592; Terug</button>
  <h1 id="title">Levensboek</h1>
  <button id="btnHome" class="barbtn" aria-label="Begin">&#8962; Begin</button>
</header>
<main id="view"></main>
<div id="slideshow" hidden>
  <img id="ssA" alt=""><img id="ssB" alt="">
  <div id="ssCaption"></div>
  <div id="ssHint">Tik op het scherm om terug te gaan</div>
</div>
<div id="lightbox" hidden>
  <div id="lbCaption"></div>
  <button class="lbnav prev" aria-label="Vorige">&#8249;</button>
  <button class="lbnav next" aria-label="Volgende">&#8250;</button>
  <button class="lbclose" aria-label="Sluiten">&#10005; Sluiten</button>
</div>
<input type="file" id="zipInput" accept=".zip,application/zip" multiple hidden>
<script src="config.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/d3-array.min.js"></script>
<script src="vendor/d3-geo.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
